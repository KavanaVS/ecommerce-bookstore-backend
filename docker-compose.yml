services:
  postgres:
    image: postgres:16-alpine
    container_name: bookstore-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-bookstore}
      POSTGRES_USER: ${DB_USERNAME:-bookstore_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bookstore_pass}
    ports:
      - "5432:5432"
    volumes:
      - bookstore_pgdata:/var/lib/postgresql/data

volumes:
  bookstore_pgdata:
